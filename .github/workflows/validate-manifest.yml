# Validates manifest.json against schemas/manifest.schema.json and against the
# skills/ tree on disk. The description of a skill is duplicated in SKILL.md
# frontmatter (read by the agent picker) and manifest.json (read by the PLX MC
# skills directory); this job enforces that the two agree byte-for-byte.
#
# Without it, three defects reached agents unnoticed: a SKILL.md frontmatter
# ScannerError (#10), seven manifest descriptions reduced to the literal
# block-scalar marker ">-" (#11), and six descriptions drifting out of sync.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: Validate manifest and skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the gitRef reachability check can resolve commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --quiet jsonschema pyyaml
      - name: Validate manifest
        run: python scripts/validate-manifest.py
